MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'on'
  IF_WITH_CENTER: 'no'
  NAME: 'ViT-B-16'
  STRIDE_SIZE: [16, 16]
  SIE_CAMERA: False
  SIE_VIEW: False
  SIE_COE: 1.0
  ID_LOSS_WEIGHT: 0.25
  TRIPLET_LOSS_WEIGHT: 1.0
  I2T_LOSS_WEIGHT: 1.0
  OCTAR:
    ENABLED: True
    RMTD_WEIGHT: 0.03
    APR_WEIGHT: 0.05
    WARMUP_EPOCHS: 10
    RTG_TOKEN_RATIO: 0.6
    RTG_BATCH_TOPK_RATIO: 0.5
    RTG_SCORE_THRESHOLD: -999.0
    RTG_ENSURE_ONE: True
    CANDIDATE_RATIO: 0.6
    CANDIDATE_SCORE_THRESHOLD: -999.0
    REGION_BINS: [0.0, 0.35, 0.70, 1.0]
    REGION_MIN_TOKENS: 1
    REGION_CONF_THRESHOLD: 0.0
    REGION_CONF_TOPK_RATIO: 0.5
    REGION_ADAPTIVE_QUOTA: True
    REGION_QUOTA_TEMPERATURE: 0.05
    MASK_OVERLAP_THRESHOLD: 0.5
    PTA_ALPHA: 0.3
    PTA_TEMPERATURE: 0.07
    APR_MOMENTUM: 0.1
    NORMALIZE_FEATURES: True

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]
  SOC:
    ENABLED: True
    PROB: 0.5
    AREA_RANGE: [0.15, 0.35]
    ASPECT_RANGE: [0.3, 3.3]
    BLEND_ALPHA: 1.0
    OCC_REID_WEIGHT: 0.5
    AVOID_SAME_ID: True
    EDGE_RATIO: 0.2
    BODY_X_RANGE: [0.2, 0.8]
    BODY_Y_RANGE: [0.15, 0.85]
    PARTS:
      - [0.15, 0.35]
      - [0.35, 0.65]
      - [0.65, 0.85]
    NUM_SOURCE_CANDIDATES: 8
    NUM_TARGET_CANDIDATES: 8
    TOPK: 3
    SAMPLE_MODE: 'softmax'
    TEMPERATURE: 0.2
    SRC_WEIGHT: 1.0
    TAR_WEIGHT: 1.0
    HARD_WEIGHT: 0.5
    UNREAL_WEIGHT: 0.2
    TARGET_ID_WEIGHT: 0.5
    TARGET_NEG_WEIGHT: 0.0
    MIN_VISIBLE_RATIO: 0.55

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  SEED: 1
  STAGE1:
    IMS_PER_BATCH: 64
    OPTIMIZER_NAME: 'Adam'
    BASE_LR: 0.00035
    WARMUP_LR_INIT: 0.00001
    LR_MIN: 0.000001
    WARMUP_METHOD: 'linear'
    WEIGHT_DECAY: 0.0001
    WEIGHT_DECAY_BIAS: 0.0001
    MAX_EPOCHS: 120
    CHECKPOINT_PERIOD: 120
    LOG_PERIOD: 50
    WARMUP_EPOCHS: 5
  STAGE2:
    IMS_PER_BATCH: 64
    OPTIMIZER_NAME: 'Adam'
    BASE_LR: 0.000005
    WARMUP_METHOD: 'linear'
    WARMUP_ITERS: 10
    WARMUP_FACTOR: 0.1
    WEIGHT_DECAY: 0.0001
    WEIGHT_DECAY_BIAS: 0.0001
    LARGE_FC_LR: False
    MAX_EPOCHS: 100
    CHECKPOINT_PERIOD: 100
    LOG_PERIOD: 50
    EVAL_PERIOD: 100
    EVAL_EPOCHS: [10, 20, 40, 60, 80, 90, 100]
    BIAS_LR_FACTOR: 2
    STEPS: [50, 90]
    GAMMA: 0.1

TEST:
  EVAL: True
  IMS_PER_BATCH: 64
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

DATASETS:
  NAMES: 'market1501'
  ROOT_DIR: './data'

OUTPUT_DIR: 'outputs/octar_market1501'
